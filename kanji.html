<title>Kanji - Kitsumi</title>

<style>

* {

}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f8fc;
  color: #202124;
}

header {
  background: white;
  padding: 20px;
  text-align: center;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

header h1 {
  margin: 0;
  color: #ff6b6b;
  font-size: 28px;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

.back {
  display: inline-block;
  margin-bottom: 15px;
  color: #555;
  text-decoration: none;
  font-size: 16px;
}

.progress-box {
  background: white;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 20px;
}

.progress-top {
  display: flex;
  justify-content: space-between;
  font-weight: bold;
  margin-bottom: 10px;
}

.progress-bar {
  height: 12px;
  background: #eee;
  border-radius: 20px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #ff6b6b;
  transition: .3s;
}

.card {
  background: white;
  border-radius: 25px;
  padding: 30px 20px;
  text-align: center;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

.kanji {
  font-size: 100px;
  font-weight: bold;
  margin: 10px 0;
}

.romaji {
  font-size: 24px;
  font-weight: bold;
  color: #ff6b6b;
}

.meaning {
  font-size: 20px;
  margin-top: 8px;
}

.example {
  margin-top: 20px;
  padding: 15px;
  background: #f7f8fc;
  border-radius: 15px;
}

.example-kanji {
  font-size: 28px;
  font-weight: bold;
}

.example-text {
  margin-top: 5px;
  color: #666;
}

.counter {
  margin-top: 20px;
  font-weight: bold;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

button {
  border: none;
  border-radius: 15px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.prev {
  flex: 1;
  background: #eee;
}

.next {
  flex: 1;
  background: #ff6b6b;
  color: white;
}

.mode-buttons {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.mode-buttons button {
  flex: 1;
  background: white;
  border: 2px solid #ff6b6b;
  color: #ff6b6b;
}

.quiz {
  display: none;
}

.question {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 20px;
}

.quiz-kanji {
  font-size: 90px;
  font-weight: bold;
  margin: 20px;
}

.options {
  display: grid;
  gap: 10px;
}

.option {
  background: #f7f8fc;
  padding: 16px;
  border-radius: 15px;
  border: 2px solid transparent;
}

.option:hover {
  border-color: #ff6b6b;
}

.result {
  text-align: center;
  display: none;
}

.score {
  font-size: 45px;
  font-weight: bold;
  color: #ff6b6b;
}

.restart {
  width: 100%;
  background: #ff6b6b;
  color: white;
  margin-top: 20px;
}

</style>

<div class="mode-buttons">

</div>

</div>

kanjiData.splice(120);

let posisi = 0;

let sudahDipajari =
  JSON.parse(
    localStorage.getItem("kitsumiKanji")
  ) || [];

function updateProgress() {

  const jumlah = sudahDipajari.length;

  const persen =
    (jumlah / kanjiData.length) * 100;

  document.getElementById("progressText")
    .textContent =
    jumlah + " / " + kanjiData.length;

  document.getElementById("progressFill")
    .style.width =
    persen + "%";
}

function tandaiDipajari(index) {

  if (!sudahDipajari.includes(index)) {

    sudahDipajari.push(index);

    localStorage.setItem(
      "kitsumiKanji",
      JSON.stringify(sudahDipelajari)
    );

  }

  updateProgress();
}

function tampilkan() {

  const data = kanjiData[posisi];

  document.getElementById("kanji")
    .textContent = data.k;

  document.getElementById("romaji")
    .textContent = data.r;

  document.getElementById("meaning")
    .textContent = data.m;

  document.getElementById("example")
    .textContent = data.e;

  document.getElementById("exampleMeaning")
    .textContent = data.em;

  document.getElementById("counter")
    .textContent =
    (posisi + 1) + " / " + kanjiData.length;

  tandaiDipajari(posisi);
}

function berikutnya() {

  if (posisi < kanjiData.length - 1) {
    posisi++;
  } else {
    posisi = 0;
  }

  tampilkan();
}

function sebelumnya() {

  if (posisi > 0) {
    posisi--;
  } else {
    posisi = kanjiData.length - 1;
  }

  tampilkan();
}

function modeBelajar() {

  document.getElementById("learning")
    .style.display = "block";

  document.getElementById("quiz")
    .style.display = "none";

  document.getElementById("result")
    .style.display = "none";

  tampilkan();
}


/* =====================
   QUIZ
===================== */

let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;

function mulaiQuiz() {

  quizQuestions =
    [...kanjiData]
    .sort(() => Math.random() - .5)
    .slice(0, 10);

  quizIndex = 0;
  quizScore = 0;

  document.getElementById("learning")
    .style.display = "none";

  document.getElementById("quiz")
    .style.display = "block";

  document.getElementById("result")
    .style.display = "none";

  tampilkanQuiz();
}

function tampilkanQuiz() {

  const soal =
    quizQuestions[quizIndex];

  document.getElementById("quizKanji")
    .textContent = soal.k;

  let pilihan = [soal.m];

  while (pilihan.length < 4) {

    const random =
      kanjiData[
        Math.floor(
          Math.random() * kanjiData.length
        )
      ].m;

    if (!pilihan.includes(random)) {
      pilihan.push(random);
    }
  }

  pilihan.sort(() => Math.random() - .5);

  const options =
    document.getElementById("options");

  options.innerHTML = "";

  pilihan.forEach(jawaban => {

    const button =
      document.createElement("button");

    button.className = "option";
    button.textContent = jawaban;

    button.onclick = () => {

      if (jawaban === soal.m) {
        quizScore++;
      }

      quizIndex++;

      if (quizIndex < quizQuestions.length) {
        tampilkanQuiz();
      } else {
        selesaiQuiz();
      }

    };

    options.appendChild(button);

  });

}

function selesaiQuiz() {

  document.getElementById("quiz")
    .style.display = "none";

  document.getElementById("result")
    .style.display = "block";

  document.getElementById("score")
    .textContent =
    quizScore + " / 10";

  let best =
    Number(
      localStorage.getItem("kitsumiBestKanji")
    ) || 0;

  if (quizScore > best) {

    best = quizScore;

    localStorage.setItem(
      "kitsumiBestKanji",
      best
    );

  }

  document.getElementById("bestScore")
    .textContent =
    "🏆 Skor terbaik: " + best + " / 10";
}

updateProgress();
tampilkan();

</script>
<script>

function updateBerandaProgress() {

  // KOSAKATA
  const vocab =
    JSON.parse(
      localStorage.getItem("kitsumiKosakata")
    ) || [];

  const jumlahVocab = Math.min(vocab.length, 50);

  const persenVocab =
    (jumlahVocab / 50) * 100;

  document.getElementById("vocabProgress")
    .textContent =
    jumlahVocab + " / 50";

  document.getElementById("vocabFill")
    .style.width =
    persenVocab + "%";


  // KANJI
  const kanji =
    JSON.parse(
      localStorage.getItem("kitsumiKanji")
    ) || [];

  const jumlahKanji = Math.min(kanji.length, 120);

  const persenKanji =
    (jumlahKanji / 120) * 100;

  document.getElementById("kanjiProgress")
    .textContent =
    jumlahKanji + " / 120";

  document.getElementById("kanjiFill")
    .style.width =
    persenKanji + "%";

}

updateBerandaProgress();

</script>
</body>
</html>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: #f7faff;
      color: #263238;
    }

    button {
      font-family: inherit;
      border: none;
      cursor: pointer;
    }

    /* SPLASH */
    #splash {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      background: #dff0ff;
      z-index: 9999;
      overflow: hidden;
    }

    #splash img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .loading {
      position: absolute;
      top: 67%;
      left: 20%;
      width: 60%;
      height: 15px;
      background: white;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress {
      width: 0;
      height: 100%;
      background: #ff7fa4;
      border-radius: 20px;
      animation: loading 2.5s linear forwards;
    }

    @keyframes loading {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
